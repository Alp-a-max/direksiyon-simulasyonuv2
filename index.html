<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş Direksiyon Simülasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* GENEL TASARIM - NEO-HUD STİLİ */
        body {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0d1a29 100%);
            color: #00ffc4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,255,196,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        h1 {
            font-size: 2em;
            text-shadow: 0 0 20px #00ffc4, 0 0 40px #00ffc4;
            margin: 20px 0 30px 0;
            position: relative;
            z-index: 1;
            animation: glow 2s ease-in-out infinite alternate;
            text-align: center;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px #00ffc4, 0 0 40px #00ffc4; }
            to { text-shadow: 0 0 30px #00ffc4, 0 0 60px #00ffc4, 0 0 80px #00ffc4; }
        }

        .console-container {
            background: rgba(13, 26, 41, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid #00ffc4;
            box-shadow: 0 0 30px rgba(0, 255, 196, 0.4), 
                        inset 0 0 20px rgba(0, 255, 196, 0.1),
                        0 10px 50px rgba(0, 0, 0, 0.5);
            padding: 30px 40px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 90%;
            max-width: 900px;
            position: relative;
            z-index: 1;
            animation: containerPulse 3s ease-in-out infinite;
            margin-bottom: 40px;
        }

        @keyframes containerPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(0, 255, 196, 0.4), inset 0 0 20px rgba(0, 255, 196, 0.1); }
            50% { box-shadow: 0 0 50px rgba(0, 255, 196, 0.6), inset 0 0 30px rgba(0, 255, 196, 0.2); }
        }

        /* --- VERİ PANOSU (TOP) --- */
        .data-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            width: 100%;
            gap: 20px;
            margin-bottom: 20px;
        }

        .data-segment {
            text-align: center;
            padding: 20px 15px;
            border: 2px solid #00ffc4;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(0, 255, 196, 0.05) 0%, rgba(0, 255, 196, 0.15) 100%);
            box-shadow: 0 5px 15px rgba(0, 255, 196, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .data-segment::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 255, 196, 0.1), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .data-segment:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 196, 0.4);
            border-color: #64ffda;
        }

        .data-label {
            font-size: 0.75em;
            color: #64ffda;
            opacity: 0.9;
            margin-bottom: 8px;
            letter-spacing: 3px;
            position: relative;
            z-index: 1;
        }

        .data-value {
            font-size: 1.8em;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffc4, 0 0 20px #00ffc4;
            position: relative;
            z-index: 1;
        }
        
        /* Viraj Durumu Alanı */
        #valStatSegment {
            grid-column: 1 / -1;
            padding: 25px 15px;
            font-size: 1.4em;
            background: #00ffc4;
            color: #0d1a29;
            border: none;
            text-shadow: none;
            transition: all 0.4s ease;
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        /* --- DİREKSİYON & GÖSTERGE ALANI --- */
        .wheel-area {
            display: flex;
            align-items: center;
            gap: 60px;
            position: relative;
        }

        /* Direksiyon Görseli */
        .wheel-display {
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(circle, rgba(0, 255, 196, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(0, 255, 196, 0.3);
        }

        #steeringWheelImg {
            width: 85%;
            height: 85%;
            filter: invert(1) drop-shadow(0 0 20px #00ffc4) drop-shadow(0 0 40px #00ffc4);
            transition: transform 0.15s ease-out;
        }
        
        /* --- SLIDER KONTROL --- */
        .control-area {
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
            position: relative;
            padding: 20px;
            background: rgba(0, 255, 196, 0.05);
            border: 2px solid #00ffc4;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 196, 0.3);
        }

        #steerSlider {
            width: 100%;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #ff6b6b 0%, #00ffc4 50%, #ff6b6b 100%);
            height: 12px;
            border-radius: 6px;
            border: 2px solid #00ffc4;
            box-shadow: 0 0 15px rgba(0, 255, 196, 0.6), inset 0 2px 5px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        #steerSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff4757 0%, #e74c3c 100%);
            cursor: grab;
            box-shadow: 0 0 20px #e74c3c, 0 5px 15px rgba(0, 0, 0, 0.5);
            border: 3px solid #fff;
            transition: all 0.2s ease;
        }

        #steerSlider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 30px #e74c3c, 0 8px 20px rgba(0, 0, 0, 0.7);
        }

        #steerSlider::-webkit-slider-thumb:active {
            cursor: grabbing;
            transform: scale(1.1);
        }
        
        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75em;
            color: #64ffda;
            margin-top: 10px;
            text-shadow: 0 0 5px #00ffc4;
        }
        
        /* Yön Göstergeleri (SOL/SAĞ) */
        .direction-indicator {
            width: 15px;
            height: 50px;
            margin: 0 15px;
            background: rgba(243, 156, 18, 0.2);
            border: 2px solid #f39c12;
            border-radius: 8px;
            transition: all 0.2s ease;
            position: relative;
        }

        .direction-indicator::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 0;
            border-style: solid;
        }

        #leftInd::before {
            border-width: 10px 15px 10px 0;
            border-color: transparent #f39c12 transparent transparent;
        }

        #rightInd::before {
            border-width: 10px 0 10px 15px;
            border-color: transparent transparent transparent #f39c12;
        }

        .active-left { 
            background: #f39c12 !important; 
            box-shadow: 0 0 25px #f39c12, 0 0 50px #f39c12 !important;
            animation: blink 0.5s infinite;
        }
        
        .active-right { 
            background: #f39c12 !important; 
            box-shadow: 0 0 25px #f39c12, 0 0 50px #f39c12 !important;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }


    </style>
</head>
<body>

    <h1>Direksiyon Konsolu (Pi Simülasyonu)</h1>

    <div class="console-container">
        
        <div class="data-panel">
            <div class="data-segment">
                <div class="data-label">AÇI</div>
                <div class="data-value" id="valDeg">0°</div>
            </div>
            <div class="data-segment">
                <div class="data-label">RADYAN KATSAYISI</div>
                <div class="data-value"><span id="valPi">0.000</span> π</div>
            </div>
            <div class="data-segment">
                <div class="data-label">YÖN</div>
                <div class="data-value" id="valDir">MERKEZ</div>
            </div>
            <div class="data-segment">
                <div class="data-label">π FONKSİYONU</div>
                <div class="data-value" id="valFunc" style="font-size: 1.2em;">sin: 0.000<br>cos: 1.000</div>
            </div>
        </div>

        <div class="wheel-area">
            <div class="direction-indicator" id="leftInd"></div>

            <div class="wheel-display">
                <img id="steeringWheelImg" src="https://cdn-icons-png.flaticon.com/512/1566/1566362.png" alt="Direksiyon">
            </div>
            
            <div class="direction-indicator" id="rightInd"></div>
        </div>

        <div class="data-panel" style="width: 100%;">
            <div class="data-segment" id="valStatSegment">
                <span id="valStat">Düz gidiyor</span>
            </div>
        </div>

        <div class="control-area">
            <input type="range" id="steerSlider" min="-450" max="450" value="0" step="1">
            <div class="slider-labels">
                <span>SOL - 450°</span>
                <span>MERKEZ</span>
                <span>SAĞ + 450°</span>
            </div>
        </div>
    </div>


    <script>
        // HTML elemanlarını seçelim
        const slider = document.getElementById('steerSlider');
        const wheelImg = document.getElementById('steeringWheelImg');
        const valDegTxt = document.getElementById('valDeg');
        const valPiTxt = document.getElementById('valPi');
        const valDirTxt = document.getElementById('valDir');
        const valStatTxt = document.getElementById('valStat');
        const valFuncTxt = document.getElementById('valFunc');
        const statSegment = document.getElementById('valStatSegment');
        const leftInd = document.getElementById('leftInd');
        const rightInd = document.getElementById('rightInd');
        
        // Deadzone (Ölü Bölge) için bir sabit belirleyelim - Daha geniş alan
        const DEADZONE = 30;

        // Viraj şiddetine göre arka plan renkleri (RGB 0-255)
        const statusColors = {
            "Düz gidiyor": 'rgba(0, 255, 196, 1)', 
            "Hafif viraj": 'rgba(255, 255, 0, 1)',  
            "Orta viraj": 'rgba(255, 165, 0, 1)',    
            "Keskin viraj": 'rgba(255, 99, 71, 1)', 
            "Çok keskin viraj": 'rgba(255, 69, 0, 1)',
            "U dönüşü yapıyor": 'rgba(255, 0, 0, 1)'  
        };
        
        function updateSimulation() {
            // 1. Slider'dan anlık değeri al (-450 ile +450 arası)
            let currentAngle = parseInt(slider.value);

            // 2. Direksiyon görselini döndür (CSS transform)
            wheelImg.style.transform = `rotate(${currentAngle}deg)`;
            
            // 3. Matematiksel Hesaplamalar
            let absDeg = Math.abs(currentAngle); 
            
            // Deadzone (Ölü bölge) kontrolü: Merkezde daha az hassas
            let effectiveAngle = currentAngle;
            if (absDeg < DEADZONE) { 
                absDeg = 0;
                effectiveAngle = 0;
            }

            let anglePi = absDeg / 180.0; // Pi hesabı

            // 4. Yön Belirleme ve Yön Işıkları
            let direction = "MERKEZ";
            
            leftInd.classList.remove('active-left');
            rightInd.classList.remove('active-right');

            if (effectiveAngle < -DEADZONE) {
                direction = "SOL";
                leftInd.classList.add('active-left');
            } else if (effectiveAngle > DEADZONE) {
                direction = "SAĞ";
                rightInd.classList.add('active-right');
            }

            // 5. Viraj Durumu Mantığı (Kademeli) - 450 DERECEYE UYARLANDI - DAHA GENİŞ ARALIKLARLA
            let turnType;
            if (absDeg == 0) turnType = "Düz gidiyor";
            else if (absDeg < 90) turnType = "Düz gidiyor";     // 0-90 derece: Düz yol
            else if (absDeg < 180) turnType = "Hafif viraj";    // 90-180 derece: Hafif viraj
            else if (absDeg < 270) turnType = "Orta viraj";     // 180-270 derece: Orta viraj
            else if (absDeg < 360) turnType = "Keskin viraj";   // 270-360 derece: Keskin viraj
            else if (absDeg < 420) turnType = "Çok keskin viraj";// 360-420 derece: Çok keskin viraj
            else turnType = "U dönüşü yapıyor";                 // 420+ derece: U dönüşü

            // 6. Sonuçları Ekrana Yazdır
            valDegTxt.innerText = currentAngle + "°";
            valPiTxt.innerText = anglePi.toFixed(3);
            valDirTxt.innerText = direction;
            valStatTxt.innerText = turnType.toUpperCase();
            
            // Pi fonksiyonu değerleri (trigonometrik)
            let radianValue = (currentAngle * Math.PI) / 180; // Radyan cinsinden
            let sinValue = Math.sin(radianValue);
            let cosValue = Math.cos(radianValue);
            valFuncTxt.innerHTML = `sin(${anglePi.toFixed(3)}π) = ${sinValue.toFixed(3)}<br>cos(${anglePi.toFixed(3)}π) = ${cosValue.toFixed(3)}`;
            
            // 7. Duruma göre rengi dinamik olarak değiştir
            statSegment.style.backgroundColor = statusColors[turnType];
            statSegment.style.boxShadow = `0 0 15px ${statusColors[turnType].replace('1)', '0.8)')}`;
        }

        // Slider hareket ettirildiğinde fonksiyonu çalıştır
        slider.addEventListener('input', updateSimulation);

        // Sayfa ilk açıldığında bir kez çalıştır
        updateSimulation();
    </script>
</body>
</html>
